[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metapython"
version = "0.7.0"
description = "Comprehensive Meta-Analysis Platform with Plugin Ecosystem"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mahmood Cyber", email = "mahmood726.cyber@example.com"},
    {name = "Metapython Development Team"},
]
maintainers = [
    {name = "Mahmood Cyber", email = "mahmood726.cyber@example.com"},
]
keywords = [
    "meta-analysis", 
    "statistics", 
    "research", 
    "evidence-synthesis", 
    "bayesian", 
    "network-meta-analysis",
    "reproducibility"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
# Advanced statistical methods
advanced = [
    "numpyro>=0.12.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "statsmodels>=0.13.0",
]

# Bayesian methods (alias for advanced)
bayesian = [
    "numpyro>=0.12.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "pymc>=5.0.0",
    "arviz>=0.15.0",
]

# Machine learning and NLP
ml = [
    "scikit-learn>=1.0.0",
    "xgboost>=1.6.0",
    "shap>=0.41.0",
    "spacy>=3.4.0",
]

# Data platform integrations
integrations = [
    "boto3>=1.26.0",
    "google-cloud-storage>=2.7.0",
    "google-cloud-bigquery>=3.4.0",
    "azure-storage-blob>=12.14.0",
    "snowflake-connector-python>=3.0.0",
    "pyspark>=3.3.0",
]

# Cloud storage (subset of integrations)
cloud = [
    "boto3>=1.26.0",
    "google-cloud-storage>=2.7.0",
    "azure-storage-blob>=12.14.0",
]

# Performance and benchmarking
performance = [
    "numba>=0.56.0",
    "dask[dataframe]>=2022.1.0",
    "joblib>=1.1.0",
    "psutil>=5.9.0",
]

# Web and API features
web = [
    "streamlit>=1.15.0",
    "flask>=2.2.0",
    "jinja2>=3.1.0",
    "requests>=2.28.0",
]

# Documentation and communication
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "nbsphinx>=0.8.0",
    "jupyter>=1.0.0",
]

# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]

# Reproducibility tools
reproducibility = [
    "pyyaml>=6.0",
    "packaging>=21.0",
    "cryptography>=38.0.0",
]

# Complete installation with all features
all = [
    "numpyro>=0.12.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "statsmodels>=0.13.0",
    "pymc>=5.0.0",
    "arviz>=0.15.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.6.0",
    "shap>=0.41.0",
    "spacy>=3.4.0",
    "boto3>=1.26.0",
    "google-cloud-storage>=2.7.0",
    "google-cloud-bigquery>=3.4.0",
    "azure-storage-blob>=12.14.0",
    "snowflake-connector-python>=3.0.0",
    "pyspark>=3.3.0",
    "numba>=0.56.0",
    "dask[dataframe]>=2022.1.0",
    "joblib>=1.1.0",
    "psutil>=5.9.0",
    "streamlit>=1.15.0",
    "flask>=2.2.0",
    "jinja2>=3.1.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "packaging>=21.0",
    "cryptography>=38.0.0",
]

[project.urls]
Homepage = "https://github.com/mahmood726-cyber/Metapython"
Documentation = "https://metapython.readthedocs.io/"
Repository = "https://github.com/mahmood726-cyber/Metapython"
"Bug Tracker" = "https://github.com/mahmood726-cyber/Metapython/issues"
"Discussions" = "https://github.com/mahmood726-cyber/Metapython/discussions"
"Changelog" = "https://github.com/mahmood726-cyber/Metapython/blob/main/CHANGELOG.md"
"Roadmap" = "https://github.com/mahmood726-cyber/Metapython/blob/main/docs/ROADMAP.md"

[project.scripts]
metapython = "metapython.cli:main"
metapython-benchmark = "metapython.benchmarks:main"

[project.entry-points."metapython.plugins"]
# Official example plugins
example_effect_transformer = "metapython.plugins.examples:ExampleEffectSizeTransformer"
example_data_reader = "metapython.plugins.examples:ExampleDatasetReader"
example_report_renderer = "metapython.plugins.examples:ExampleReportRenderer"

[tool.setuptools.packages.find]
include = ["metapython*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
metapython = ["*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=metapython --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmarks",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "sklearn.*",
    "numpyro.*",
    "jax.*",
    "pymc.*",
    "arviz.*",
    "boto3.*",
    "google.*",
    "azure.*",
    "snowflake.*",
    "pyspark.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["metapython"]
omit = ["*/tests/*", "*/test_*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod",
]