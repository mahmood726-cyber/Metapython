[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "metapython"
version = "0.5.0"
description = "Professional meta-analysis platform with cutting-edge methods from top statistics journals"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "MetaPython Development Team", email = "mahmood726.cyber@gmail.com"}
]
keywords = ["meta-analysis", "statistics", "medicine", "research", "publication-bias", "bayesian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "scikit-learn>=0.24.0",
]

[project.optional-dependencies]
full = [
    "pymc>=5.0.0",
    "arviz>=0.12.0",
    "plotly>=5.0.0",
    "statsmodels>=0.13.0",
    "networkx>=2.6.0",
]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "mypy>=0.910",
    "flake8>=3.9.0",
    "sphinx>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/mahmood726-cyber/Metapython"
"Bug Reports" = "https://github.com/mahmood726-cyber/Metapython/issues"
"Source" = "https://github.com/mahmood726-cyber/Metapython"

[project.scripts]
metapython = "metapython.cli.commands:main"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--verbose --cov=metapython --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["metapython"]
omit = ["*/tests/*", "*/benchmarks/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
