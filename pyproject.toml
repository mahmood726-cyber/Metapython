[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metapython"
version = "0.6.0"
description = "Comprehensive meta-analysis platform combining PyMeta and CBAMM with enterprise-grade features"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "PyMeta-CBAMM Development Team", email = "pymeta-cbamm@example.com"}
]
maintainers = [
    {name = "PyMeta-CBAMM Development Team", email = "pymeta-cbamm@example.com"}
]
keywords = [
    "meta-analysis", "statistics", "research", "evidence-synthesis", 
    "systematic-review", "biostatistics", "clinical-research"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
# Performance and scalability extras
performance = [
    "numba>=0.56.0",
    "dask[dataframe]>=2022.1.0",
    "joblib>=1.1.0",
]

# Advanced statistical methods
stats = [
    "statsmodels>=0.13.0",
    "pymc>=4.0.0",
    "arviz>=0.12.0",
]

# Machine learning and NLP
ml = [
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "shap>=0.40.0",
    "spacy>=3.4.0",
]

# Optimization and transport
optimization = [
    "cvxpy>=1.2.0",
]

# Data connectors and formats
data = [
    "pyarrow>=6.0.0",
    "fastparquet>=0.8.0",
    "feather-format>=0.4.0",
    "openpyxl>=3.0.0",
    "xlsxwriter>=3.0.0",
]

# Web and API services
web = [
    "fastapi>=0.85.0",
    "uvicorn[standard]>=0.18.0",
    "streamlit>=1.15.0",
    "jinja2>=3.0.0",
    "pydantic>=1.10.0",
]

# Observability and monitoring
observability = [
    "opentelemetry-api>=1.15.0",
    "opentelemetry-sdk>=1.15.0",
    "opentelemetry-instrumentation-fastapi>=0.36b0",
    "prometheus-client>=0.15.0",
    "structlog>=22.1.0",
]

# Security and authentication  
security = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.5",
    "cryptography>=3.4.0",
]

# Development and testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.20.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "pre-commit>=2.20.0",
]

# Pipeline and automation
pipeline = [
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=12.0.0",
    "typer>=0.7.0",
]

# Biomedical integrations
bio = [
    "biopython>=1.79",
]

# All optional dependencies
all = [
    "metapython[performance,stats,ml,optimization,data,web,observability,security,dev,pipeline,bio]"
]

[project.urls]
Homepage = "https://github.com/mahmood726-cyber/Metapython"
Documentation = "https://github.com/mahmood726-cyber/Metapython/wiki"
Repository = "https://github.com/mahmood726-cyber/Metapython"
"Bug Tracker" = "https://github.com/mahmood726-cyber/Metapython/issues"
Changelog = "https://github.com/mahmood726-cyber/Metapython/blob/main/CHANGELOG.md"

[project.scripts]
metapython = "metapython.cli:main"
meta-cli = "metapython.cli:main"

[tool.setuptools]
py-modules = ["metapython"]

[tool.setuptools.packages.find]
where = ["."]
include = ["metapython*"]

# Testing configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "performance: Performance tests",
    "slow: Slow running tests",
    "network: Tests requiring network access",
]

[tool.coverage.run]
source = ["metapython"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Code formatting
[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["metapython"]

# Type checking
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*", 
    "matplotlib.*",
    "seaborn.*",
    "scipy.*",
    "sklearn.*",
    "numba.*",
    "dask.*",
    "pymc.*",
    "arviz.*",
    "cvxpy.*",
    "pyarrow.*",
    "fastparquet.*",
    "Bio.*",
    "streamlit.*",
    "shap.*",
    "spacy.*",
]
ignore_missing_imports = true