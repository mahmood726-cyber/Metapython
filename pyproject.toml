[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metapython"
dynamic = ["version", "description"]
authors = [
    {name = "PyMeta-CBAMM Development Team", email = "pymeta-cbamm@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
keywords = [
    "meta-analysis", "statistics", "evidence-based-medicine", 
    "systematic-review", "research-synthesis", "medical-research",
    "publication-bias", "network-meta-analysis", "bayesian-analysis"
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
# Distributed compute extras
distributed = [
    "dask[distributed]>=2023.1.0",
    "ray>=2.0.0",
]

# GPU acceleration extras  
gpu = [
    "jax[cuda12]>=0.4.0",
    "jaxlib>=0.4.0",
]

# Spark integration extras
spark = [
    "pyspark>=3.4.0",
]

# Bayesian analysis extras
bayesian = [
    "pymc>=5.0.0",
    "arviz>=0.15.0",
]

# Advanced statistical methods
advanced = [
    "statsmodels>=0.13.0",
    "scikit-learn>=1.1.0",
]

# NLP and text processing
nlp = [
    "spacy>=3.4.0",
    "transformers>=4.20.0",
]

# Web interfaces and APIs
web = [
    "streamlit>=1.20.0",
    "flask>=2.2.0",
    "fastapi>=0.95.0",
]

# CLI and automation
cli = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

# Development and testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

# Performance optimization
performance = [
    "numba>=0.56.0",
    "joblib>=1.2.0",
]

# Visualization enhancements
viz = [
    "plotly>=5.10.0",
    "bokeh>=3.0.0",
]

# All optional dependencies
all = [
    "metapython[distributed,gpu,spark,bayesian,advanced,nlp,web,cli,performance,viz]",
]

[project.urls]
Homepage = "https://github.com/mahmood726-cyber/Metapython"
Documentation = "https://metapython.readthedocs.io"
Repository = "https://github.com/mahmood726-cyber/Metapython"
"Bug Reports" = "https://github.com/mahmood726-cyber/Metapython/issues"
Changelog = "https://github.com/mahmood726-cyber/Metapython/blob/main/CHANGELOG.md"

[project.scripts]
metapython = "metapython:main"
meta-cli = "metapython:cli_main"

[project.entry-points."metapython.plugins"]
# Plugin entry points for the marketplace

[tool.setuptools]
py-modules = ["metapython"]

[tool.setuptools.dynamic]
version = {attr = "metapython.__version__"}
description = {attr = "metapython.__description__"}

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
    "distributed: marks tests that require distributed computing",
]

[tool.coverage.run]
source = ["metapython"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod",
]

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]