name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  automated-release:
    name: Automated Release Process
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          pip install bump2version conventional-changelog build twine
          
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: Generate version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            bump2version ${{ github.event.inputs.version_bump }} --dry-run --list | grep new_version= | cut -d= -f2 > new_version.txt
          else
            echo "${GITHUB_REF#refs/tags/v}" > new_version.txt
          fi
          echo "version=$(cat new_version.txt)" >> $GITHUB_OUTPUT
          
      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from conventional commits
          conventional-changelog -p angular -i CHANGELOG.md -s -r 0
          
          # Extract latest version changelog
          awk '/^## \[/{if(++n>1) exit} n>=1' CHANGELOG.md > latest_changelog.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat latest_changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Update version in code
        run: |
          sed -i 's/__version__ = ".*"/__version__ = "${{ steps.version.outputs.version }}"/' metapython.py
          sed -i 's/Version: .*/Version: ${{ steps.version.outputs.version }}/' metapython.py
          
      - name: Commit version changes
        if: github.event_name == 'workflow_dispatch'
        run: |
          git add metapython.py CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin main --tags

  build-distributions:
    name: Build Package Distributions
    runs-on: ubuntu-latest
    needs: automated-release
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools
          
      - name: Build source distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m build --sdist
        
      - name: Build wheel
        run: python -m build --wheel
        
      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

  smoke-tests:
    name: Smoke Tests
    runs-on: ${{ matrix.os }}
    needs: build-distributions
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
          
      - name: Install from wheel
        run: |
          pip install dist/*.whl
          
      - name: Run smoke tests
        run: |
          python -c "import metapython; print(f'Version: {metapython.__version__}')"
          python -c "import metapython; print('Basic import test passed')"
          python -c "import metapython; cm = metapython.get_compute_manager(); print(f'Available executors: {cm.get_available_executors()}')"

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [automated-release, build-distributions, smoke-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.automated-release.outputs.version }}
          name: Release v${{ needs.automated-release.outputs.version }}
          body: ${{ needs.automated-release.outputs.changelog }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.automated-release.outputs.version, 'rc') }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [automated-release, build-distributions, smoke-tests]
    environment: release
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-ubuntu-latest-py3.11
          path: dist/
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    steps:
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula: metapython

  update-docker:
    name: Update Docker Image
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            metapython/metapython:latest
            metapython/metapython:${{ needs.automated-release.outputs.version }}
          platforms: linux/amd64,linux/arm64