name: Security and Supply Chain Hardening

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  sbom-generation:
    name: Generate SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: metapython-sbom.spdx.json
          
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: metapython-sbom.spdx.json

  provenance-attestation:
    name: Generate Provenance (SLSA)
    runs-on: ubuntu-latest
    needs: [sbom-generation]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          
      - name: Build package
        run: python -m build
        
      - name: Generate provenance for wheels
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
        with:
          base64-subjects: "${{ hashFiles('dist/*') }}"
          
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v2.1.1
        with:
          inputs: './dist/*.whl'
          
  sast-analysis:
    name: Static Analysis Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: +security-and-quality,security-extended
          
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  dependency-scan:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit pip-audit
          
      - name: Run Safety check
        run: safety check --json --output safety-report.json || true
        
      - name: Run Bandit security linter
        run: bandit -r metapython.py -f json -o bandit-report.json || true
        
      - name: Run pip-audit
        run: pip-audit --format=json --output=pip-audit-report.json || true
        
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json
            bandit-report.json
            pip-audit-report.json

  reproducible-build:
    name: Verify Reproducible Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
          
      - name: Build wheel
        run: python -m build --wheel
        
      - name: Verify build reproducibility
        run: |
          # Build twice and compare hashes
          python -m build --wheel
          find dist -name "*.whl" -exec sha256sum {} \; > build1.sha256
          rm -rf dist/
          python -m build --wheel
          find dist -name "*.whl" -exec sha256sum {} \; > build2.sha256
          diff build1.sha256 build2.sha256 || echo "Build not reproducible"