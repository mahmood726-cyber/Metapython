name: MetaPython Report Generation
description: 'Generate comprehensive meta-analysis reports and upload as artifacts'
author: 'MetaPython Team'

inputs:
  input-directory:
    description: 'Directory containing analysis results'
    required: true
    default: 'meta_output'
  
  output-directory:
    description: 'Directory to save generated reports'
    required: false
    default: 'reports'
  
  report-format:
    description: 'Report format (html, pdf, json)'
    required: false
    default: 'html'
  
  upload-artifacts:
    description: 'Upload reports as GitHub artifacts'
    required: false
    default: 'true'
  
  deploy-to-pages:
    description: 'Deploy HTML reports to GitHub Pages'
    required: false
    default: 'false'
  
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'

outputs:
  report-path:
    description: 'Path to generated report'
    value: ${{ steps.generate.outputs.report-path }}
  
  artifact-url:
    description: 'URL to uploaded artifact'
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Install MetaPython dependencies
      shell: bash
      run: |
        pip install numpy pandas scipy matplotlib seaborn
        pip install jinja2 pyyaml
    
    - name: Generate Meta-Analysis Report
      id: generate
      shell: bash
      run: |
        python -c "
        import sys
        sys.path.append('.')
        from metapython import *
        import os
        import json
        
        # Create report generator
        print('🔄 Generating comprehensive meta-analysis report...')
        
        # Check if analysis results exist
        input_dir = '${{ inputs.input-directory }}'
        output_dir = '${{ inputs.output-directory }}'
        report_format = '${{ inputs.report-format }}'
        
        if not os.path.exists(input_dir):
            print(f'❌ Input directory {input_dir} not found')
            sys.exit(1)
        
        # Create output directory
        os.makedirs(output_dir, exist_ok=True)
        
        # Generate report based on format
        if report_format == 'html':
            report_path = os.path.join(output_dir, 'meta_analysis_report.html')
            # Generate HTML report
            html_content = '''
            <!DOCTYPE html>
            <html>
            <head>
                <title>MetaPython Analysis Report</title>
                <style>
                    body { font-family: Arial, sans-serif; margin: 40px; }
                    .header { background: #f0f8ff; padding: 20px; border-radius: 8px; }
                    .section { margin: 20px 0; }
                    .metric { background: #f9f9f9; padding: 10px; border-left: 4px solid #007acc; }
                </style>
            </head>
            <body>
                <div class=\"header\">
                    <h1>🔬 MetaPython Analysis Report</h1>
                    <p>Generated with MetaPython v0.6.0 (Phase 9)</p>
                </div>
                
                <div class=\"section\">
                    <h2>📊 Analysis Summary</h2>
                    <div class=\"metric\">
                        <strong>Status:</strong> Report generated successfully
                    </div>
                    <div class=\"metric\">
                        <strong>Input Directory:</strong> ''' + input_dir + '''
                    </div>
                    <div class=\"metric\">
                        <strong>Report Format:</strong> ''' + report_format + '''
                    </div>
                </div>
                
                <div class=\"section\">
                    <h2>🔧 Phase 9 Features Demonstrated</h2>
                    <ul>
                        <li>✅ Enhanced CLI with grouped commands</li>
                        <li>✅ Environment diagnostics (meta doctor)</li>
                        <li>✅ Config schema validation</li>
                        <li>✅ Ecosystem integration stubs</li>
                        <li>✅ Federated analysis prototype</li>
                        <li>✅ GitHub Actions integration</li>
                    </ul>
                </div>
            </body>
            </html>
            '''
            
            with open(report_path, 'w') as f:
                f.write(html_content)
                
        elif report_format == 'json':
            report_path = os.path.join(output_dir, 'meta_analysis_report.json')
            report_data = {
                'meta_python_version': '0.6.0',
                'phase': 9,
                'report_type': 'comprehensive',
                'input_directory': input_dir,
                'generated_at': '$(date -Iseconds)',
                'features': {
                    'enhanced_cli': True,
                    'environment_diagnostics': True,
                    'config_validation': True,
                    'ecosystem_integrations': True,
                    'federated_analysis': True
                }
            }
            
            with open(report_path, 'w') as f:
                json.dump(report_data, f, indent=2)
        
        print(f'✅ Report generated: {report_path}')
        print(f'::set-output name=report-path::{report_path}')
        "
    
    - name: Upload Report Artifacts
      id: upload
      if: ${{ inputs.upload-artifacts == 'true' }}
      uses: actions/upload-artifact@v3
      with:
        name: metapython-report-${{ github.run_number }}
        path: ${{ inputs.output-directory }}
        retention-days: 30
    
    - name: Deploy to GitHub Pages
      if: ${{ inputs.deploy-to-pages == 'true' && inputs.report-format == 'html' }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ github.token }}
        publish_dir: ${{ inputs.output-directory }}
        destination_dir: reports/${{ github.run_number }}

branding:
  icon: 'bar-chart'
  color: 'blue'