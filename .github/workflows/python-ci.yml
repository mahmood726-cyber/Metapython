name: Python CI/CD

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Code Quality Checks
  # ============================================================================
  code-quality:
    name: Code Quality (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 pylint mypy bandit safety

      - name: Black formatting check
        run: |
          black --check --diff metapython/ tests/
        continue-on-error: true

      - name: isort import sorting check
        run: |
          isort --check-only --diff metapython/ tests/
        continue-on-error: true

      - name: Flake8 linting
        run: |
          flake8 metapython/ tests/ --max-line-length=100 --ignore=E203,W503
        continue-on-error: true

      - name: Pylint analysis
        run: |
          pylint metapython/ --exit-zero --disable=C0111,R0913,R0914
        continue-on-error: true

      - name: MyPy type checking
        run: |
          mypy metapython/ --ignore-missing-imports
        continue-on-error: true

      - name: Bandit security check
        run: |
          bandit -r metapython/ -ll
        continue-on-error: true

      - name: Safety dependency check
        run: |
          safety check --json
        continue-on-error: true

  # ============================================================================
  # Unit Tests - Matrix across Python versions
  # ============================================================================
  test-python:
    name: Python Tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python-version: '3.9'
          - os: windows-latest
            python-version: '3.9'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev gfortran

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openblas lapack gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-mock
          pip install -r requirements-full.txt

      - name: Run tests with pytest
        run: |
          pytest tests/ \
            --cov=metapython \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            -v \
            -n auto \
            --timeout=300 \
            --maxfail=5

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}

      - name: Archive coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: htmlcov/

  # ============================================================================
  # R Integration Tests
  # ============================================================================
  test-r-integration:
    name: R Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("metafor", "meta", "devtools", "testthat"), repos="https://cloud.r-project.org")'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install rpy2 pytest

      - name: Test R plotting module
        run: |
          pytest tests/test_r_plotting.py -v
        continue-on-error: true

  # ============================================================================
  # ML Module Tests (separate due to heavy dependencies)
  # ============================================================================
  test-ml:
    name: ML Module Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install scikit-learn tensorflow torch xgboost lightgbm
          pip install pytest pytest-cov

      - name: Run ML tests
        run: |
          pytest tests/test_ml*.py -v --cov=metapython.ml

      - name: Upload ML coverage
        uses: codecov/codecov-action@v4
        with:
          flags: ml
          name: ml-tests

  # ============================================================================
  # FastAPI Backend Tests
  # ============================================================================
  test-api:
    name: FastAPI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install fastapi uvicorn httpx pytest pytest-asyncio

      - name: Run API tests
        run: |
          pytest api/tests/ -v
        continue-on-error: true

  # ============================================================================
  # Documentation Build
  # ============================================================================
  docs:
    name: Documentation Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints

      - name: Build documentation
        run: |
          cd docs
          make html
        continue-on-error: true

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/

  # ============================================================================
  # Performance Tests
  # ============================================================================
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-benchmark

      - name: Run benchmarks
        run: |
          pytest benchmarks/ --benchmark-only --benchmark-json=output.json
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: output.json

  # ============================================================================
  # Build Distribution
  # ============================================================================
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [code-quality, test-python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
