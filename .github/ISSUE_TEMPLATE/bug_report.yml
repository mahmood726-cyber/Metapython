name: Bug Report
description: File a bug report to help us improve MetaPython
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees:
  - mahmood726-cyber
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us resolve the issue quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Tell us what you expected!
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Import metapython
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Please run `python metapython.py doctor --format json` and paste the output here
      placeholder: |
        ```json
        {
          "overall_status": "healthy",
          "environment": {...}
        }
        ```
    validations:
      required: true

  - type: dropdown
    id: analysis-type
    attributes:
      label: Analysis Type
      description: What type of analysis were you running?
      options:
        - Standard meta-analysis
        - Network meta-analysis
        - Diagnostic test accuracy
        - Sparse events analysis
        - Federated analysis
        - Other
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues for this bug
          required: true
        - label: I have run `meta doctor` to check my environment
          required: true
        - label: I can reproduce this issue consistently
          required: true
        - label: I have included all relevant error messages and logs
          required: true