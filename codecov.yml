# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
        if_ci_failed: error

    patch:
      default:
        target: 70%
        threshold: 5%
        base: auto

# Comment configuration
comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignore paths
ignore:
  - "tests/*"
  - "setup.py"
  - "**/__pycache__"
  - "**/test_*.py"
  - "docs/*"
  - "examples/*"
  - "benchmarks/*"

# Flags for different test types
flags:
  python:
    paths:
      - metapython/
    carryforward: true

  ml:
    paths:
      - metapython/ml/
    carryforward: true

  frontend:
    paths:
      - frontend/src/
    carryforward: true

# Component-based coverage
component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
      - type: patch
        target: 70%

  individual_components:
    - component_id: core
      name: Core Module
      paths:
        - metapython/core/**

    - component_id: bayesian
      name: Bayesian Methods
      paths:
        - metapython/bayesian/**
        - metapython/advanced_bayesian/**

    - component_id: ml
      name: Machine Learning
      paths:
        - metapython/ml/**

    - component_id: plotting
      name: R Plotting
      paths:
        - metapython/r_plotting/**

    - component_id: api
      name: FastAPI Backend
      paths:
        - api/**
