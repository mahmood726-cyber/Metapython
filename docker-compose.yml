# MetaPython Docker Compose Configuration
# Complete stack with database, cache, API, and frontend

version: '3.8'

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: metapython-postgres
    environment:
      POSTGRES_USER: metapython
      POSTGRES_PASSWORD: metapython_secure_password
      POSTGRES_DB: metapython
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapython"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metapython-network
    restart: unless-stopped

  # ========================================
  # Redis Cache
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: metapython-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metapython-network
    restart: unless-stopped

  # ========================================
  # MetaPython API
  # ========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: metapython-api
    environment:
      - DATABASE_URL=postgresql://metapython:metapython_secure_password@postgres:5432/metapython
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - ENVIRONMENT=production
    volumes:
      - ./metapython:/app/metapython
      - ./alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - metapython-network
    restart: unless-stopped

  # ========================================
  # React Frontend
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metapython-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - metapython-network
    restart: unless-stopped

  # ========================================
  # Grafana (Monitoring)
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: metapython-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - metapython-network
    restart: unless-stopped

  # ========================================
  # Prometheus (Metrics)
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: metapython-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - metapython-network
    restart: unless-stopped

  # ========================================
  # Nginx (Reverse Proxy)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: metapython-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
    networks:
      - metapython-network
    restart: unless-stopped

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

# ========================================
# Networks
# ========================================
networks:
  metapython-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
