[pytest]
# Pytest configuration for MetaPython

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_r: marks tests that require R to be installed
    requires_ml: marks tests that require ML libraries

# Coverage options (if pytest-cov is installed)
# Uncomment these when ready for coverage reporting
# [coverage:run]
# source = .
# omit = tests/*,setup.py

# Minimum version
minversion = 7.0

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
