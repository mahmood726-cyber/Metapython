[pytest]
# Pytest Configuration

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Add project root to Python path
pythonpath = .

# Minimum Python version
minversion = 7.0

# Command line options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers
    --strict-markers
    # Strict config
    --strict-config
    # Show warnings
    -W default
    # Coverage options
    --cov=metapython
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Parallel execution
    -n auto
    # Timeout for tests
    --timeout=300
    # Fail after N failures
    --maxfail=10
    # Show slowest tests
    --durations=10

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    ml: marks tests requiring ML dependencies
    r: marks tests requiring R dependencies
    api: marks tests for API endpoints
    frontend: marks tests for frontend
    benchmark: marks performance benchmark tests
    requires_gpu: marks tests requiring GPU
    requires_network: marks tests requiring network access

# Ignore directories
norecursedirs =
    .git
    .github
    .venv
    venv
    build
    dist
    *.egg-info
    __pycache__
    .pytest_cache
    .mypy_cache
    node_modules
    frontend

# Coverage settings
[coverage:run]
source = metapython
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    setup.py

[coverage:report]
precision = 2
exclude_lines =
    # Default excludes
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod
    # Debug-only code
    if self.debug:
    if settings.DEBUG
    # Type checking
    if typing.TYPE_CHECKING:

[coverage:html]
directory = htmlcov

# Flake8 configuration
[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,
    *.egg-info,
    .pytest_cache,
    .mypy_cache,
    node_modules
ignore =
    E203,  # whitespace before ':'
    W503,  # line break before binary operator
    E501,  # line too long (handled by black)
per-file-ignores =
    __init__.py:F401
max-complexity = 15

# MyPy configuration
[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
